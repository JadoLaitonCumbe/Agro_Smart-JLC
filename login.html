<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164b35"><title>Entrar · AGRO Smart</title><link rel="stylesheet" href="/assets/css/app.css"></head><body class="auth-page"><main class="auth-card"><div class="brand-mark">AS</div><p class="eyebrow">AGRICULTURA INTELIGENTE</p><h1>AGRO <span>Smart</span></h1><p class="muted">Gestão agropecuária, IoT e decisões em tempo real.</p><form id="loginForm"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Palavra-passe</label><input name="password" type="password" required autocomplete="current-password"><button class="btn primary full">Entrar</button><p id="message" class="form-message" role="alert"></p></form><small>Ambiente empresarial · Acesso autorizado</small></main><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),m=document.querySelector('#message');m.textContent='A validar…';try{const r=await fetch('/api/auth/login.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})}),d=await r.json();if(!r.ok)throw Error(d.error||'Falha');sessionStorage.setItem('agro_csrf',d.csrf);location='/dashboard.html'}catch(x){m.textContent=x.message}});</script></body></html>
